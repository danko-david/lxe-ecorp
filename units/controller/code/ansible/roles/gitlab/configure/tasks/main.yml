- name: Wait gitlab config initialization
  ansible.builtin.wait_for:
    path: /ecorp/data/gitlab/config/gitlab.rb
    state: present
    timeout: 300

- name: Configure GitLab
  blockinfile:
    marker: "# {mark} ANSIBLE MANAGED BLOCK - custom configuration"
    path: /ecorp/data/gitlab/config/gitlab.rb
    block: |
      external_url 'http://gitlab.{{ ECORP_DNS_CORE_ZONE_NAME }}'
      registry_external_url 'http://gitlab.{{ ECORP_DNS_CORE_ZONE_NAME }}:5005'
  register: gitlab_config

- name: Reconfigure GitLab
  command: "docker exec -t ecorp-gitlab-1 gitlab-ctl reconfigure"
  when: gitlab_config.changed

- name: Wait for GitLab to be ready
  include_role:
    name: gitlab/wait_for_gitlab

- name: Check if GitLab accepts the root personal access token
  ansible.builtin.uri:
    url: "http://gitlab.{{ ECORP_DNS_CORE_ZONE_NAME }}/api/v4/user"
    headers:
      PRIVATE-TOKEN: "{{ gitlab_root_token }}"
    status_code: [200, 401]
  register: token_check

- name: Generate root PAT if it is missing, expired or was replaced
  when: token_check.status != 200
  include_tasks: gen_root_pat.yml

- name: Load ECORP_* environment variables
  set_fact:
    ecorp_vars: "{{ ansible_env | dict2items | selectattr('key', 'match', '^ECORP_') | list }}"

- name: Set global GitLab CI/CD variables
  community.general.gitlab_instance_variable:
    api_url: "http://gitlab.{{ ECORP_DNS_CORE_ZONE_NAME }}"
    api_token: "{{ gitlab_root_token }}"
    state: present
    purge: false
    variables:
      - name: "{{ item.key }}"
        value: "{{ item.value }}"
        masked: false
        protected: false
  loop: "{{ ecorp_vars }}"
  when: ecorp_vars | length > 0

- name: Init git import enviroment
  shell: |
    git config --global credential.helper store
    git credential approve << EOF
    protocol=http
    host=gitlab.{{ ECORP_DNS_CORE_ZONE_NAME }}
    username=root
    password={{ lookup('env', 'GITLAB_ROOT_PASSWORD') }}
    EOF

    git config --global --add safe.directory /ecorp